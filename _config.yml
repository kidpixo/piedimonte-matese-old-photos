# Setup
title:               'Il Cotonificio Egg di Piedimonte Matese'
tagline:             'Una Storia Industriale e Sociale Attraverso le Mappe'
description:         'La storia del Cotonificio Egg di Piedimonte Matese, esplorando la sua evoluzione industriale e sociale attraverso mappe interattive e dati storici.'
url:                 'https://kidpixo.github.io' # The base hostname & protocol for your site
baseurl:             '/piedimonte-matese-old-photos'  # Empty if deployed at root, or '/repo-name' if project site

permalink:           pretty

# ADR-010: language assumed when a page declares no `lang`. Must match
# DEFAULT_LANG in scripts/process_research.py and a key of _data/i18n.yml.
default_lang:        it

# About/contact
author:
  name:              Mario D'Amore
  # url:               https://twitter.com/mdo
  email:             maariodamore77@gmail.com

# Custom vars
version:             1.1.0
# google_analytics_id: #UA-XXXX-Y

# CDN Libraries (Single Source of Truth)
# SRI hashes: Generate via https://www.srihash.org/
cdn_libs:
  # Core mapping library
  leaflet_css: "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  leaflet_js: "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"
  
  # Utilities
  jquery: "https://code.jquery.com/jquery-3.6.0.min.js"
  bootstrap_css: "https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
  bootstrap_js: "https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
  
  # Leaflet plugins
  georaster: "https://cdn.jsdelivr.net/npm/georaster@1.6.0/dist/georaster.browser.bundle.min.js"
  georaster_layer: "https://cdn.jsdelivr.net/npm/georaster-layer-for-leaflet@3.10.0/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"
  leaflet_bing: "https://cdn.jsdelivr.net/npm/leaflet-bing-layer@3.3.1/leaflet-bing-layer.min.js"
  leaflet_locate_css: "https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.83.1/L.Control.Locate.css"
  leaflet_locate_js: "https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.83.1/L.Control.Locate.min.js"

  # Leaflet fullscreen plugin (mapbox)
  leaflet_fullscreen_js: "https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"
  leaflet_fullscreen_css: "https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css"

  # Mermaid diagrams (ESM)
  mermaid: "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs"

  # DataTables 2.x with Bootstrap 5 (no jQuery required)
  datatables_css: "https://cdn.datatables.net/2.2.2/css/dataTables.bootstrap5.min.css"
  datatables_js: "https://cdn.datatables.net/2.2.2/js/dataTables.min.js"
  datatables_bs5_js: "https://cdn.datatables.net/2.2.2/js/dataTables.bootstrap5.min.js"

collections:
  photos:
    output: true
    permalink: /photos/:slug/
  topics:
    output: true
    # ADR-010: the folder carries the URL, so translations need no per-file permalink.
    # _topics/topics/x.md -> /topics/x/ ; _topics/en/topics/x.md -> /en/topics/x/
    # Every topic file must therefore live under a segment folder, not at the
    # collection root. `:path` does not slugify: keep filenames URL-safe.
    permalink: /:path/

# Files Jekyll must neither build nor watch. Two different reasons live here:
#   * data and tooling that are not site content (raw_data, scripts, tests);
#   * dot-directories, which Jekyll already skips when reading but still *watches*,
#     so editing `.ai/01_STRUCTURE.md` would otherwise trigger a pointless rebuild.
exclude:
  - archive/
  - raw_data/
  - scripts/
  - tests/
  - vendor/
  - .ai/
  - .agents/
  # Repo documentation: it used to be published as /README.md, /AGENTS/, /LICENSE.md
  - README.md
  - AGENTS.md
  - LICENSE.md
  # Build and tooling files with no business in _site
  - Makefile
  - Dockerfile
  - docker-compose.yml
  - docker-compose_dev.yml
  - docker-entrypoint.sh
  - Gemfile
  - Gemfile.lock
  - pytest.ini
  - requirements.txt
  - tags
