# UI strings per language (ADR-010). Layouts read:
#   {% assign t = site.data.i18n[page.lang] | default: site.data.i18n[site.default_lang] %}
# so a missing key or language falls back to Italian rather than rendering empty.
#
# `site:` (title / tagline / description) is optional per language: omit it and
# _config.yml supplies the default-language wording, so _config.yml stays the
# Italian source of truth instead of being duplicated here.
#
# Editorial content does NOT live here — it lives in the page/topic files.
# Only interface chrome belongs in this file.

