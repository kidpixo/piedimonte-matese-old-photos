---
layout: default
---

<!-- Include Block -->
<script src="{{ site.cdn_libs.jquery }}"></script>

<link  href="{{ site.cdn_libs.leaflet_css }}" rel="stylesheet" />
<script src="{{ site.cdn_libs.leaflet_js }}"></script>

<link href="{{ site.cdn_libs.bootstrap_css }}" rel="stylesheet" />
<script src="{{ site.cdn_libs.bootstrap_js }}"></script>

<link href="{{ '/assets/css/map.css' | relative_url }}" rel="stylesheet"/>

<script src="{{ site.cdn_libs.georaster }}"></script>

<script src="{{ site.cdn_libs.georaster_layer }}"></script>

<!-- Add the Bing plugin script -->
<script src="{{ site.cdn_libs.leaflet_bing }}"></script>

<!-- add plugin leaflet-locatecontrol: A leaflet control to geolocate the user https://github.com/domoritz/leaflet-locatecontrol -->
<link  href="{{ site.cdn_libs.leaflet_locate_css }}" rel="stylesheet" />
<script src="{{ site.cdn_libs.leaflet_locate_js }}"></script>

<!-- Add the Leaflet Fullscreen plugin -->
<script src="{{ site.cdn_libs.leaflet_fullscreen_js }}"></script>
<link href="{{ site.cdn_libs.leaflet_fullscreen_css }}" rel="stylesheet" />

<!-- Add the Leaflet MarkerCluster plugin -->
<!-- Not used; if re-enabled, add leaflet_markercluster keys to cdn_libs in _config.yml -->


<!-- Pass variables from page frontmatter to Javascript -->
<script>
  const locateControlEnabled = {{ page.map.locate_control | default: "false" | jsonify }};
  const centerLat = {{ page.map.center_lat | default: "41.355946" | jsonify }};
  const centerLng = {{ page.map.center_lng | default: "14.370868" | jsonify }};
  const zoomLevel = {{ page.map.zoom | default: "18" | jsonify }};
  const base_url = "{{ site.baseurl }}";
  const map_id = "{{ page.map.id | default: "map" }}";
  const map_title = "{{ page.title | default: "Map" }}";
  const map_description = "{{ pagedescription | default: "Map description" }}";
  const map_data = {{ page.map.data | default: "[]" | jsonify }};
  const activeLayers = {{ page.map.activelayers | default: "[]" | jsonify }};
  const layerControlCollapsed = false;

  window.activeLayers = activeLayers;
  window.centerLat = centerLat;
  window.centerLng = centerLng;
  window.zoomLevel = zoomLevel;
  window.layerControlCollapsed = layerControlCollapsed;
  window.locateControlEnabled = locateControlEnabled;
</script>

<div class="page">
  <h1 class="page-title">{{ page.title }}</h1>
  {{ content }}
  <div class="page">
    <div class="folium-map" id="map" style="width: 100%; height: 80vh;"></div>
  </div>
</div>

<!-- Include the external map javascript code -->
<script src="{{ site.baseurl }}/assets/js/myscript.js"></script>
