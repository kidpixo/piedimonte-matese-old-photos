<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true });

  // This part ensures that Jekyll's default code block output 
  // (which uses .language-mermaid) is picked up by Mermaid.js
  document.addEventListener('DOMContentLoaded', function () {
    const blocks = document.querySelectorAll('pre code.language-mermaid');
    blocks.forEach((block) => {
      const parent = block.parentElement;
      const diagram = block.textContent;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = diagram;
      parent.parentNode.insertBefore(div, parent);
      parent.remove();
    });
  });
</script>
